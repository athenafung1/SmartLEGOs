services:
  supernode-1:
    image: flwr/supernode:1.39.0
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-0
      - --allow-runtime-dependency-installation
    environment:
      FLWR_MODEL_API_KEY: ${FLWR_MODEL_API_KEY:?Set FLWR_MODEL_API_KEY before running docker compose}
      FLWR_FILESYSTEM_ALLOWED_DIRS: /data/supernode-building-a
    volumes:
      - ./keys:/keys:ro
      - ./data/supernode-building-a:/data/supernode-building-a

  supernode-2:
    image: flwr/supernode:1.39.0
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-1
      - --allow-runtime-dependency-installation
    environment:
      FLWR_MODEL_API_KEY: ${FLWR_MODEL_API_KEY:?Set FLWR_MODEL_API_KEY before running docker compose}
      FLWR_FILESYSTEM_ALLOWED_DIRS: /data/supernode-building-b
    volumes:
      - ./keys:/keys:ro
      - ./data/supernode-building-b:/data/supernode-building-b

  supernode-3:
    image: flwr/supernode:1.39.0
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-2
      - --allow-runtime-dependency-installation
    environment:
      FLWR_MODEL_API_KEY: ${FLWR_MODEL_API_KEY:?Set FLWR_MODEL_API_KEY before running docker compose}
      FLWR_FILESYSTEM_ALLOWED_DIRS: /data/supernode-building-c
    volumes:
      - ./keys:/keys:ro
      - ./data/supernode-building-c:/data/supernode-building-c